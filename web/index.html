<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repertorio Docs</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1 class="visually-hidden">Repertorio Docs</h1>
      <img
        class="banner"
        src="/static/banner.webp"
        alt=""
        width="800"
        height="267"
      />
    </header>

    <main>
      <aside class="catalog">
        <div class="panel-head">
          <h2>Documents</h2>
          <button
            type="button"
            id="select-several"
            class="quiet"
            aria-pressed="false"
            disabled
          >
            Select several
          </button>
        </div>
        <div id="catalog" class="tree"></div>
        <div id="selection" class="selection" hidden>
          <label class="visually-hidden" for="group-title"
            >Conversation title</label
          >
          <input
            type="text"
            id="group-title"
            placeholder="Name this conversation"
          />
          <div class="bar">
            <span id="selection-count" class="count"></span>
            <button type="button" id="start-group" disabled>Start</button>
            <button type="button" id="clear-selection" class="quiet">
              Clear
            </button>
          </div>
        </div>
      </aside>

      <section class="chat">
        <div class="chat-head">
          <div class="title">
            <label class="visually-hidden" for="scope">Conversation</label>
            <select id="scope"></select>
          </div>
          <div class="bar">
            <span id="scope-label" class="label"></span>
            <button type="button" id="new-thread" class="quiet">
              New conversation
            </button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
        <form id="composer">
          <label class="visually-hidden" for="question">Question</label>
          <textarea
            id="question"
            rows="2"
            placeholder="Ask a question about these documents"
          ></textarea>
          <button type="submit" id="send">Ask</button>
        </form>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
